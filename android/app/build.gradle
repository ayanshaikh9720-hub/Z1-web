apply plugin: 'com.android.application'

// Helper functions with safe fallbacks ensuring values are never null or invalid
def getExtInteger(String propName, int defaultValue) {
    if (rootProject.ext.has(propName)) {
        def val = rootProject.ext.get(propName)
        if (val != null) {
            try {
                return Integer.parseInt(val.toString().trim())
            } catch (Exception ignored) {}
        }
    }
    return defaultValue
}

def getComputedVersionCode() {
    def envCode = System.getenv("APP_VERSION_CODE")
    if (envCode != null && !envCode.trim().isEmpty()) {
        try {
            return Integer.parseInt(envCode.trim())
        } catch (Exception ignored) {}
    }
    def propCode = project.findProperty("versionCode")
    if (propCode != null && !propCode.toString().trim().isEmpty()) {
        try {
            return Integer.parseInt(propCode.toString().trim())
        } catch (Exception ignored) {}
    }
    return 1014
}

def getComputedVersionName() {
    def envName = System.getenv("APP_VERSION_NAME")
    if (envName != null && !envName.trim().isEmpty()) {
        return envName.trim()
    }
    def propName = project.findProperty("versionName")
    if (propName != null && !propName.toString().trim().isEmpty()) {
        return propName.toString().trim()
    }
    return "1.0.14"
}

android {
    namespace = "com.z1movies.app"
    compileSdk = getExtInteger('compileSdkVersion', 36)
    defaultConfig {
        applicationId "com.z1movies.app"
        minSdkVersion getExtInteger('minSdkVersion', 24)
        targetSdkVersion getExtInteger('targetSdkVersion', 35)
        versionCode getComputedVersionCode()
        versionName getComputedVersionName()
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    signingConfigs {
        release {
            def pathStr = System.getenv("ANDROID_KEYSTORE_FILE") ?: project.findProperty("RELEASE_STORE_FILE") ?: "release.keystore"
            def keystoreFile = file(pathStr)
            if (!keystoreFile.exists()) {
                keystoreFile = file("app/${pathStr}")
            }
            if (!keystoreFile.exists()) {
                keystoreFile = file("../${pathStr}")
            }
            if (keystoreFile.exists()) {
                storeFile keystoreFile
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD") ?: project.findProperty("RELEASE_STORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS") ?: project.findProperty("RELEASE_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD") ?: project.findProperty("RELEASE_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            def releaseSigning = signingConfigs.findByName("release")
            if (releaseSigning != null && releaseSigning.storeFile != null && releaseSigning.storeFile.exists()) {
                signingConfig releaseSigning
            }
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
