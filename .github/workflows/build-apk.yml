name: Build Android APK (Z1 MOVIES)

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type: debug (free/test, no keystore needed), release (requires 4 signing secrets), or both'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
          - both
      version_code:
        description: 'Version Code (leave blank for auto 1014+)'
        required: false
        default: '1014'
      version_name:
        description: 'Custom Version Name (e.g. 1.0.14)'
        required: false
        default: '1.0.14'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Determine Target Build Type
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SELECTED_TYPE="${{ inputs.build_type }}"
          else
            # On git push: default to release if keystore secret is configured, otherwise default to debug
            if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
              SELECTED_TYPE="release"
            else
              SELECTED_TYPE="debug"
              echo "::notice::ANDROID_KEYSTORE_BASE64 secret not found for push. Building Debug APK for testing."
            fi
          fi

          echo "Target build_type: $SELECTED_TYPE"
          echo "build_type=$SELECTED_TYPE" >> $GITHUB_OUTPUT

      - name: Calculate Dynamic Versioning
        id: versioning
        run: |
          # Guarantee monotonically increasing versionCode with base progression starting at 1014
          # If previous was 1013 (run 13), run 14 gives 1014. If GITHUB_RUN_NUMBER is lower, floor at 1014.
          if [ -n "${{ inputs.version_code }}" ]; then
            VERSION_CODE="${{ inputs.version_code }}"
          else
            RUN_CODE=$((1000 + GITHUB_RUN_NUMBER))
            if [ "$RUN_CODE" -lt 1014 ]; then
              VERSION_CODE=1014
            else
              VERSION_CODE="$RUN_CODE"
            fi
          fi
          
          if [ -n "${{ inputs.version_name }}" ]; then
            VERSION_NAME="${{ inputs.version_name }}"
          else
            if [ "$GITHUB_RUN_NUMBER" -le 13 ]; then
              VERSION_NAME="1.0.14"
            else
              VERSION_NAME="1.0.${GITHUB_RUN_NUMBER}"
            fi
          fi
          
          echo "Computed versionCode: $VERSION_CODE"
          echo "Computed versionName: $VERSION_NAME"
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci || npm install
          else
            npm install
          fi

      - name: Build web application
        run: npm run build

      - name: Setup Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Validate and Decode Release Keystore
        if: ${{ steps.target.outputs.build_type == 'release' || steps.target.outputs.build_type == 'both' }}
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          TARGET_TYPE: ${{ steps.target.outputs.build_type }}
        run: |
          set +x
          MISSING=""
          if [ -z "$KEYSTORE_BASE64" ]; then MISSING="$MISSING ANDROID_KEYSTORE_BASE64"; fi
          if [ -z "$KEYSTORE_PASSWORD" ]; then MISSING="$MISSING ANDROID_KEYSTORE_PASSWORD"; fi
          if [ -z "$KEY_ALIAS" ]; then MISSING="$MISSING ANDROID_KEY_ALIAS"; fi
          if [ -z "$KEY_PASSWORD" ]; then MISSING="$MISSING ANDROID_KEY_PASSWORD"; fi

          if [ -n "$MISSING" ]; then
            echo "::error::Release build cannot proceed! Required GitHub Secrets missing:$MISSING"
            echo ""
            echo "=========================================================================================="
            echo "A signed Release APK requires production signing credentials."
            echo "Required GitHub Secrets:"
            echo "  1. ANDROID_KEYSTORE_BASE64   (Base64 encoded .keystore / .jks file)"
            echo "  2. ANDROID_KEYSTORE_PASSWORD  (Keystore storepass password)"
            echo "  3. ANDROID_KEY_ALIAS          (Key alias name)"
            echo "  4. ANDROID_KEY_PASSWORD       (Key password)"
            echo ""
            echo "TIP: To build and test a free APK without signing credentials, run this workflow with:"
            echo "     build_type: debug"
            echo "=========================================================================================="
            
            if [ "$TARGET_TYPE" = "release" ]; then
              exit 1
            else
              echo "has_keystore=false" >> $GITHUB_OUTPUT
              echo "::warning::Skipping release build due to missing secrets. Debug APK will still be built."
              exit 0
            fi
          fi

          # Decode Base64 keystore into android/app/release.keystore
          mkdir -p android/app
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          
          if [ ! -s android/app/release.keystore ]; then
            echo "::error::Decoded keystore file is empty or corrupted! Please check ANDROID_KEYSTORE_BASE64."
            if [ "$TARGET_TYPE" = "release" ]; then exit 1; else echo "has_keystore=false" >> $GITHUB_OUTPUT; exit 0; fi
          fi

          # Validate keystore integrity and alias using Java keytool without logging secrets
          echo "Validating keystore integrity and key alias..."
          if ! keytool -list -keystore android/app/release.keystore -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::Keystore verification failed! Either ANDROID_KEYSTORE_PASSWORD is incorrect or ANDROID_KEY_ALIAS ('$KEY_ALIAS') was not found in keystore."
            if [ "$TARGET_TYPE" = "release" ]; then exit 1; else echo "has_keystore=false" >> $GITHUB_OUTPUT; exit 0; fi
          fi

          echo "Keystore and alias '$KEY_ALIAS' verified successfully."
          echo "has_keystore=true" >> $GITHUB_OUTPUT

      - name: Build Release APK
        if: ${{ (steps.target.outputs.build_type == 'release' || steps.target.outputs.build_type == 'both') && steps.keystore.outputs.has_keystore == 'true' }}
        env:
          APP_VERSION_CODE: ${{ steps.versioning.outputs.version_code }}
          APP_VERSION_NAME: ${{ steps.versioning.outputs.version_name }}
          ANDROID_KEYSTORE_FILE: release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          echo "Building signed Release APK (versionCode: $APP_VERSION_CODE, versionName: $APP_VERSION_NAME)..."
          ./gradlew assembleRelease

          # Verify output APK exists
          RELEASE_APK="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$RELEASE_APK" ]; then
            echo "::error::Signed Release APK was not found at android/$RELEASE_APK!"
            exit 1
          fi

          APK_SIZE=$(ls -lh "$RELEASE_APK" | awk '{print $5}')
          echo "Signed Release APK successfully generated: android/$RELEASE_APK ($APK_SIZE)"

      - name: Build Debug APK
        if: ${{ steps.target.outputs.build_type == 'debug' || steps.target.outputs.build_type == 'both' }}
        env:
          APP_VERSION_CODE: ${{ steps.versioning.outputs.version_code }}
          APP_VERSION_NAME: ${{ steps.versioning.outputs.version_name }}
        run: |
          cd android
          chmod +x gradlew
          echo "Building Debug APK (versionCode: $APP_VERSION_CODE, versionName: $APP_VERSION_NAME)..."
          ./gradlew assembleDebug

          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$DEBUG_APK" ]; then
            echo "::error::Debug APK was not found at android/$DEBUG_APK!"
            exit 1
          fi

          APK_SIZE=$(ls -lh "$DEBUG_APK" | awk '{print $5}')
          echo "Debug APK successfully generated: android/$DEBUG_APK ($APK_SIZE)"

      - name: Clean Keystore from Workspace
        if: always()
        run: |
          rm -f android/app/release.keystore

      - name: Upload Signed Release APK
        if: ${{ (steps.target.outputs.build_type == 'release' || steps.target.outputs.build_type == 'both') && steps.keystore.outputs.has_keystore == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: Z1-Movies-Release-APK-${{ steps.versioning.outputs.version_name }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload Debug APK
        if: ${{ steps.target.outputs.build_type == 'debug' || steps.target.outputs.build_type == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: Z1-Movies-Debug-APK-${{ steps.versioning.outputs.version_name }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
